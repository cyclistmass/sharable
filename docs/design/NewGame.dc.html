<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 888px; height: 400px; box-sizing: border-box; background: #0B0907; font-family: 'Alegreya Sans', sans-serif; color: #EDE6D8; padding: 14px; display: flex; gap: 14px">
  <section style="flex: 1 1 0; background: linear-gradient(#4A3020, #2A1B10); border: 3px solid #C9A04A; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Alegreya SC', serif; font-size: 22px; color: #F1D58A">Players</h1>
    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Change photo" style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #D32F2F; background: #6B5544; color: #EFE3C8; font: 700 11px 'Alegreya Sans', sans-serif">[photo]</button>
      <label style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 0; font-size: 12px; color: #CDBFA6">Your name
        <input value="Mauro" style="height: 32px; border-radius: 8px; border: 2px solid #C9A04A; background: #EFE3C8; color: #2B2118; font: 600 15px 'Alegreya Sans', sans-serif; padding: 0 10px">
      </label>
      <span style="font-size: 12px; color: #CDBFA6; width: 90px">Tap photo to take or pick one</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{seats}}" as="seat" hint-placeholder-count="3">
        <div style="background: rgba(0,0,0,0.28); border-radius: 10px; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px">
          <span style="font-weight: 700; color: {{seat.color}}">{{seat.label}}</span>
          <div style="display: flex; gap: 3px">
            <sc-for list="{{seat.kinds}}" as="k" hint-placeholder-count="3">
              <button onClick="{{k.pick}}" style="flex: 1 1 0; height: 28px; border-radius: 7px; border: 2px solid {{k.ring}}; background: {{k.bg}}; color: {{k.ink}}; font: 600 12px 'Alegreya Sans', sans-serif; padding: 0">{{k.name}}</button>
            </sc-for>
          </div>
          <sc-if value="{{seat.isBot}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; gap: 3px">
              <sc-for list="{{seat.bots}}" as="b" hint-placeholder-count="3">
                <button onClick="{{b.pick}}" style="flex: 1 1 0; height: 26px; border-radius: 7px; border: 2px solid {{b.ring}}; background: {{b.bg}}; color: {{b.ink}}; font: 600 11px 'Alegreya Sans', sans-serif; padding: 0">{{b.name}}</button>
              </sc-for>
            </div>
            <span style="font-size: 11px; color: #CDBFA6">{{seat.botNote}}</span>
          </sc-if>
          <sc-if value="{{seat.isFriend}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; color: #CDBFA6">Invite from the lobby, or pass this phone</span>
          </sc-if>
          <sc-if value="{{seat.isEmpty}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; color: #CDBFA6">Nobody sits here</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <h2 style="margin: 4px 0 0; font-family: 'Alegreya SC', serif; font-size: 18px; color: #F1D58A">Game</h2>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1 1 0; height: 40px; border-radius: 9px; border: 2px solid #F1D58A; background: #C9A04A; color: #2A1B10; font: 700 15px 'Alegreya Sans', sans-serif">Base game</button>
      <button style="flex: 1 1 0; height: 40px; border-radius: 9px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font: 600 15px 'Alegreya Sans', sans-serif">Age of Chivalry</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
      <span style="width: 70px; color: #CDBFA6">Points</span>
      <button aria-label="Fewer points" style="width: 34px; height: 34px; border-radius: 8px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font-size: 18px">-</button>
      <span style="font-weight: 700; font-size: 18px; width: 28px; text-align: center">10</span>
      <button aria-label="More points" style="width: 34px; height: 34px; border-radius: 8px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font-size: 18px">+</button>
    </div>
  </section>
  <section style="width: 300px; background: linear-gradient(#4A3020, #2A1B10); border: 3px solid #C9A04A; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-family: 'Alegreya SC', serif; font-size: 22px; color: #F1D58A">Dice</h2>
    <button style="height: 46px; border-radius: 9px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font: 600 15px 'Alegreya Sans', sans-serif; text-align: left; padding: 0 12px">True random <span style="font-weight: 400; color: #CDBFA6">· every phone adds to each roll</span></button>
    <button style="height: 46px; border-radius: 9px; border: 2px solid #F1D58A; background: #C9A04A; color: #2A1B10; font: 700 15px 'Alegreya Sans', sans-serif; text-align: left; padding: 0 12px">Card deck <span style="font-weight: 500">· every total in fair shares</span></button>
    <div style="display: flex; gap: 6px; align-items: center">
      <span style="font-size: 13px; color: #CDBFA6; width: 64px">Deck size</span>
      <button style="flex: 1 1 0; height: 34px; border-radius: 8px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font: 600 14px 'Alegreya Sans', sans-serif">36</button>
      <button style="flex: 1 1 0; height: 34px; border-radius: 8px; border: 2px solid #F1D58A; background: #C9A04A; color: #2A1B10; font: 700 14px 'Alegreya Sans', sans-serif">72</button>
      <button style="flex: 1 1 0; height: 34px; border-radius: 8px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font: 600 14px 'Alegreya Sans', sans-serif">108</button>
      <button style="flex: 1 1 0; height: 34px; border-radius: 8px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font: 600 14px 'Alegreya Sans', sans-serif">144</button>
    </div>
    <span style="font-size: 12px; color: #CDBFA6">Reshuffles when 5 cards are left.</span>
    <div style="flex: 1 1 0"></div>
    <button style="height: 48px; border-radius: 10px; border: 2px solid #F1D58A; background: #3E9B4F; color: #fff; font: 700 17px 'Alegreya Sans', sans-serif">Play</button>
    <button style="height: 36px; border-radius: 10px; border: 2px solid #C9A04A; background: #2A1B10; color: #EDE6D8; font: 600 14px 'Alegreya Sans', sans-serif">Play online (open lobby)</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":888,"height":400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: ['bot', 'bot', 'bot'], bot: ['greedy', 'easy', 'strong'] };
}
renderVals() {
const BOTS = [
{ id: 'easy', name: 'Easy', note: 'Easy: random legal moves, good for learning' },
{ id: 'greedy', name: 'Greedy', note: 'Greedy: builds and trades for what it needs' },
{ id: 'strong', name: 'Strong', note: 'Strong: trained AI (arrives with issue #6)' }];
const KINDS = [{ id: 'friend', name: 'Friend' }, { id: 'bot', name: 'Bot' }, { id: 'empty', name: 'Empty' }];
const on = { ring: '#F1D58A', bg: '#C9A04A', ink: '#2A1B10' };
const off = { ring: '#C9A04A', bg: '#2A1B10', ink: '#EDE6D8' };
const colors = ['#7FB0F0', '#F7A24B', '#F5F5F5'];
const seats = [0, 1, 2].map(i => {
const kind = this.state.kind[i];
const bot = this.state.bot[i];
const set = (key, v) => { const a = this.state[key].slice(); a[i] = v; this.setState({ [key]: a }); };
return {
label: 'Seat ' + (i + 2), color: colors[i],
isBot: kind === 'bot', isFriend: kind === 'friend', isEmpty: kind === 'empty',
kinds: KINDS.map(k => ({ name: k.name, pick: () => set('kind', k.id), ...(k.id === kind ? on : off) })),
bots: BOTS.map(b => ({ name: b.name, pick: () => set('bot', b.id), ...(b.id === bot ? on : off) })),
botNote: BOTS.find(b => b.id === bot).note,
};
});
return { seats };
}
}
</script>
</body>
</html>
