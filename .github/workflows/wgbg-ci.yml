name: working-german-board-game CI

on:
  push:
    paths: ["working-german-board-game/**", ".github/workflows/wgbg-ci.yml"]
  pull_request:
    paths: ["working-german-board-game/**", ".github/workflows/wgbg-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: working-german-board-game

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; add the platform we compile against.
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-37.0" "build-tools;36.1.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine, AI and app tests (rules, fuzz, break-it, dice fairness, trading, camera)
        run: bash ./gradlew --no-daemon :engine:test :ai:test :app:testDebugUnitTest

      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: working-german-board-game-debug-apk
          path: working-german-board-game/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: working-german-board-game/**/build/reports/tests/

  # Random-input (monkey) test of the real app on an emulator: any crash or ANR fails the build.
  monkey:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: working-german-board-game-debug-apk
          path: working-german-board-game/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Monkey test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Lean Automated Test Device image (no Google services eating the CPU right after boot).
          api-level: 33
          arch: x86_64
          target: aosp_atd
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: working-german-board-game
          script: bash tools/ci_monkey.sh apk/app-debug.apk 5000

      - name: Upload monkey log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-log
          path: |
            working-german-board-game/monkey.txt
            working-german-board-game/crash.txt
